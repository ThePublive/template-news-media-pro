{# Banner Notification #}
{% if banner_notification and banner_notification.active %}
<div class="banner-notification" id="bannerNotification" data-banner-id="{{ banner_notification.id }}">
    <div class="banner-content">
        <div class="banner-message">
            {{ banner_notification.message|safe }}
        </div>
        {% if banner_notification.cta_text and banner_notification.cta_url %}
        <a href="{{ banner_notification.cta_url }}" class="banner-cta">
            {{ banner_notification.cta_text }}
        </a>
        {% endif %}
        <button class="banner-close" onclick="closeBanner()" aria-label="Close notification">
            {% include template_key~'/templates/components/common_utils/svgs/close.html' %}
        </button>
    </div>
</div>

<script>
function closeBanner() {
    const banner = document.getElementById('bannerNotification');
    const bannerId = banner.getAttribute('data-banner-id');
    banner.style.display = 'none';
    localStorage.setItem('banner_closed_' + bannerId, 'true');
}

// Check if banner was previously closed
window.addEventListener('DOMContentLoaded', function() {
    const banner = document.getElementById('bannerNotification');
    if (banner) {
        const bannerId = banner.getAttribute('data-banner-id');
        if (localStorage.getItem('banner_closed_' + bannerId) === 'true') {
            banner.style.display = 'none';
        }
    }
});
</script>

<style>
.banner-notification {
    background: var(--accent-color, #007bff);
    color: #fff;
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.banner-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.banner-message {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
}

.banner-cta {
    background: #fff;
    color: var(--accent-color, #007bff);
    padding: 8px 16px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
}

.banner-close {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
}

.banner-close svg {
    width: 20px;
    height: 20px;
    color: #fff;
}

@media (max-width: 768px) {
    .banner-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
    }
}
</style>
{% endif %}
