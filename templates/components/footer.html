{# Footer Component - News Media Pro #}
<footer class="site-footer">
    <div class="footer-content">
        <div class="footer-logo">
            {% if publisher.long_logo %}
            <img src="{{ publisher.long_logo|get_absolute_image_url('200,50') }}"
                 alt="{{ publisher.name }}">
            {% else %}
            <span class="footer-publisher-name">{{ publisher.name }}</span>
            {% endif %}
        </div>
        <div class="footer-copyright">
            © <span id="currentYear"></span> {{ publisher.name }}. All rights reserved.
        </div>
    </div>
</footer>

<script>
document.getElementById('currentYear').textContent = new Date().getFullYear();
</script>
