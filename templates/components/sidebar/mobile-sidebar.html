{# Mobile Sidebar (Hamburger Menu) #}
<div class="mobile-sidebar" id="mobileSidebar">
    <div class="mobile-sidebar-overlay" onclick="closeMobileSidebar()"></div>
    <div class="mobile-sidebar-content">
        <div class="mobile-sidebar-header">
            <a href="/" class="mobile-sidebar-logo">
                {% if publisher.logo_url %}
                <img src="{{ publisher.logo_url }}" alt="{{ publisher.name }}">
                {% else %}
                <span>{{ publisher.name }}</span>
                {% endif %}
            </a>
            <button class="mobile-sidebar-close" onclick="closeMobileSidebar()" aria-label="Close menu">
                {% include template_key~'/templates/components/common_utils/svgs/close.html' %}
            </button>
        </div>

        <nav class="mobile-sidebar-nav">
            {% include template_key~'/templates/components/common_utils/nav-items.html' %}
        </nav>

        <div class="mobile-sidebar-footer">
            {% include template_key~'/templates/components/common_utils/social-links-sidebar.html' %}
        </div>
    </div>
</div>

<script>
function openMobileSidebar() {
    document.getElementById('mobileSidebar').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    document.getElementById('mobileSidebar').classList.remove('active');
    document.body.style.overflow = 'auto';
}
</script>

<style>
.mobile-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    visibility: hidden;
    opacity: 0;
    transition: all 0.3s ease;
}

.mobile-sidebar.active {
    visibility: visible;
    opacity: 1;
}

.mobile-sidebar-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
}

.mobile-sidebar-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: var(--p-main-bg-color, #fff);
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
}

.mobile-sidebar.active .mobile-sidebar-content {
    transform: translateX(0);
}

.mobile-sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid var(--p-border-color, #e0e0e0);
}

.mobile-sidebar-logo img {
    max-height: 40px;
}

.mobile-sidebar-close {
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
}

.mobile-sidebar-close svg {
    width: 24px;
    height: 24px;
    color: var(--p-txt-color, #333);
}

.mobile-sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.mobile-sidebar-footer {
    padding: 20px;
    border-top: 1px solid var(--p-border-color, #e0e0e0);
}

@media (min-width: 1025px) {
    .mobile-sidebar {
        display: none;
    }
}
</style>
