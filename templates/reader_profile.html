{% extends template_key~"/templates/default.html" %}

{% block content %}
<div class="profile-page-container">
    <div class="container">
        <div class="profile-grid">
            <aside class="profile-sidebar">
                <nav class="profile-nav">
                    <a href="#profile" class="profile-nav-link active">Profile</a>
                    <a href="#bookmarks" class="profile-nav-link">Bookmarks</a>
                    <a href="#subscriptions" class="profile-nav-link">Subscriptions</a>
                    <a href="#settings" class="profile-nav-link">Settings</a>
                </nav>
            </aside>

            <div class="profile-content">
                <h1 class="profile-title">My Profile</h1>

                <div class="profile-info-card">
                    <form action="/profile/update" method="POST">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" value="{{ reader.name }}" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" value="{{ reader.email }}" required>
                        </div>
                        <div class="form-group">
                            <label>Bio</label>
                            <textarea name="bio" rows="4">{{ reader.bio }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
