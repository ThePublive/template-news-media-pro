{% extends template_key~"/templates/default.html" %}

{% block content %}
<div class="static-page-container">
    <div class="container">
        <div class="static-page-content">
            <h1 class="static-page-title">{{ page_title }}</h1>
            <div class="static-page-body">
                {{ page_content|safe }}
            </div>
        </div>
    </div>
</div>

<style>
.static-page-container {
    padding: 60px 0;
    min-height: 60vh;
}

.static-page-content {
    max-width: 900px;
    margin: 0 auto;
}

.static-page-title {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 30px;
    color: var(--p-txt-color, #333);
}

.static-page-body {
    line-height: 1.8;
    font-size: 16px;
    color: var(--p-txt-color, #444);
}

.static-page-body h2 {
    font-size: 28px;
    margin-top: 40px;
    margin-bottom: 20px;
}

.static-page-body p {
    margin-bottom: 16px;
}

.static-page-body ul,
.static-page-body ol {
    margin: 20px 0;
    padding-left: 30px;
}

.static-page-body li {
    margin-bottom: 10px;
}
</style>
{% endblock %}
