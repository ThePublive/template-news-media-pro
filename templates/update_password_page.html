{% extends template_key~"/templates/default.html" %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <h1 class="auth-title">Update Password</h1>
        <form class="auth-form" action="/auth/update-password" method="POST">
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" name="current_password" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="new_password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="8">
            </div>
            <button type="submit" class="auth-submit-btn">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
